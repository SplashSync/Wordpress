################################################################################
# Docker Compose File
#
# This Docker File intend to Create a Complete Dev Environment
# for Splash Modules on WordPress
#
# Each WordPress version lives in its own file under docker/compose/ and is
# pulled in by the include block below. This file only holds the services
# shared by all of them, and the networks.
#
# To use the different WordPress versions, you need to add hosts to /etc/hosts
#
# 172.101.0.10        latest.wordpress.local
# 172.101.0.71        wp7-1.wordpress.local
# 172.101.0.70        wp7-0.wordpress.local
# 172.101.0.69        wp6-9.wordpress.local
# 172.101.0.68        wp6-8.wordpress.local
# 172.101.0.67        wp6-7.wordpress.local
# 172.101.0.66        wp6-6.wordpress.local
# 172.101.0.100       toolkit.wordpress.local
# 172.101.0.200       phpmyadmin.wordpress.local
#
################################################################################

name: "splash-wordpress"

include:
    - ./docker/wordpress-latest.yml
    - ./docker/wordpress-7.1.yml
    - ./docker/wordpress-7.0.yml
    - ./docker/wordpress-6.9.yml
    - ./docker/wordpress-6.8.yml
    - ./docker/wordpress-6.7.yml
    - ./docker/wordpress-6.6.yml

services:

    ################################################################################
    # MySQL Container    
    mysql:
        image:              mysql:5.7
        container_name:     wordpress_mysql
        logging:            { driver: "none" }
        environment:
            - "MYSQL_ROOT_PASSWORD=admin"
            - "MYSQL_DATABASE=wordpress"
        networks:
            - wordpress

    ################################################################################
    # Splash Toolkit Container
    toolkit:
        image:              'splashsync/toolkit:3.0'
        container_name:     wordpress-toolkit
        logging:            { driver: "none" }
        volumes:
            # Specify Local Configuration File
            - '${PWD}/docker/toolkit/splash.yaml:/app/config/packages/splash.yaml:ro'
        hostname:           toolkit.wordpress.local
        networks:
            wordpress:      { ipv4_address: 172.101.0.100, aliases: [ toolkit.wordpress.local ] }
            splashsync:     { aliases: [ toolkit.wordpress.local ] }

    ################################################################################
    # PhpMyAdmin Container
    phpmyadmin:
        image:              phpmyadmin/phpmyadmin:5
        container_name:     wordpress_phpmyadmin
        logging:            { driver: "none" }
        depends_on:
            - mysql
        environment:
            - PMA_HOST=mysql
            - MYSQL_USER=admin
            - MYSQL_ROOT_PASSWORD=admin
            - MYSQL_PASSWORD=admin
        networks:
            wordpress:      { ipv4_address: 172.101.0.200, aliases: [ phpmyadmin.wordpress.local ] }

networks:
    ################################################################################
    # Default Private Network
    wordpress:
        driver: bridge
        ipam:
            config:
                - subnet: 172.101.0.0/24
    ################################################################################
    # External Splash Network
    splashsync:
        external: true
